.stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; isolation: isolate; background: #081326; }
.camera-stage { position: absolute; inset: 0; transform-origin: 960px 540px; }
.setting, .foreground, .actor { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.setting { z-index: 1; } .actors { position: absolute; inset: 0; z-index: 2; } .foreground { z-index: 3; pointer-events: none; }

.cat { position: absolute; left: 1320px; top: 592px; width: 350px; height: 325px; overflow: visible; }
.cat .ac-face { transform-origin: 140px 230px; }
.speech { position: absolute; z-index: 4; left: 660px; top: 128px; width: 430px; padding: 25px 30px 27px; border: 4px solid #0a1120; border-radius: 38px; color: #0a1120; background: #f4f7ff; font-size: 35px; font-weight: 760; line-height: 1.14; letter-spacing: -.7px; box-shadow: 0 16px 0 rgba(10,17,32,.22); opacity: 0; }
.speech::after { content: ""; position: absolute; right: 54px; bottom: -28px; width: 42px; height: 42px; border-right: 4px solid #0a1120; border-bottom: 4px solid #0a1120; background: #f4f7ff; transform: rotate(45deg); }
.layer-speech { transform-origin: 50% 100%; }

  .tc { --arm-l: -5deg; --fore-l: -3deg; --arm-r: 5deg; --fore-r: 3deg; --head: 1; }
  /* Точки вращения заданы в координатах viewBox, а не по bounding box: у
     fill-box начало отсчёта — габарит самой конечности, из-за чего рука
     при повороте отрывалась от плеча. Суставы же — фиксированные числа. */
  .tc-face, .tc-arm, .tc-fore, .tc-leg, .tc-head, .tc-body, .tc-eyes, .tc-brow { transform-box: view-box; }
  .tc-face-left { transform: scaleX(-1); transform-origin: 100px 210px; }
  .tc-arm-left { transform: rotate(var(--arm-l)); transform-origin: 52px 158px; }
  .tc-arm-right { transform: rotate(var(--arm-r)); transform-origin: 148px 158px; }
  .tc-fore-left { transform: rotate(var(--fore-l)); transform-origin: 45px 206px; }
  .tc-fore-right { transform: rotate(var(--fore-r)); transform-origin: 155px 206px; }
  .tc-leg-left { transform-origin: 82px 262px; }
  .tc-leg-right { transform-origin: 118px 262px; }
  .tc-head { transform-origin: 100px 126px; transform: scale(var(--head)); }
  .tc-body { transform-origin: 100px 268px; }
  .tc-eyes { transform-origin: 100px 78px; }
  .tc-brow-left { transform-origin: 83px 58px; }
  .tc-brow-right { transform-origin: 117px 58px; }
  .tc-mouth-mid, .tc-mouth-open { opacity: 0; }

  
  
  
  

  /* Речь: три формы рта переключаются жёстко и неравномерно. Ровный метроном
     читается как механизм, поэтому цикл длинный и с рваным ритмом. */

  .pose-point { --arm-r: -64deg; --fore-r: -12deg; }
  .pose-shrug { --arm-r: -36deg; --fore-r: -76deg; --arm-l: 36deg; --fore-l: 76deg; }
  /* Углы подобраны по геометрии, а не на глаз: рука двухзвенная, и чтобы
     ладонь дошла до лица, предплечье обязано сложиться навстречу плечу. */
  .pose-think { --arm-r: -100deg; --fore-r: -126deg; }
  .pose-facepalm { --arm-r: -142deg; --fore-r: -92deg; }
    /* Печать: предплечья заведены к центру, кисти сходятся перед корпусом. При
     мелком сгибе поза читалась как «руки в боки», а не «за клавиатурой». */
  .pose-type { --arm-r: -32deg; --fore-r: 88deg; --arm-l: 32deg; --fore-l: -88deg; }
  .pose-cheer { --arm-r: -158deg; --fore-r: -10deg; --arm-l: 158deg; --fore-l: 10deg; }

  .pose-facepalm .tc-head { transform: scale(var(--head)) rotate(-7deg); }
  /* Закрытые глаза важнее моргания: жест без них читается как «рука у лба». */
  .pose-facepalm .tc-eyes { transform: scaleY(0.14); }
  .pose-think .tc-brow-right { transform: translateY(-4px) rotate(-8deg); }
  .pose-shrug .tc-brow-left, .pose-shrug .tc-brow-right { transform: translateY(-5px); }
  .pose-type .tc-fore-right { }
