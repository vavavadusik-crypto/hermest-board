name: Render a video

# Рендерит проект-доску в настоящий MP4 на раннере GitHub — тем же пайплайном,
# что и локальный self-host. Нужен, чтобы получить видео без нагрузки на слабую
# или перегревающуюся машину: тяжёлый ffmpeg-проход идёт на сервере, а готовый
# ролик забирается из артефактов запуска.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Path to the board project JSON inside the repository"
        required: true
        default: examples/ai-subscriptions-60s.ru.json
      platform:
        description: "Render recipe"
        required: true
        default: youtube_video
        type: choice
        options: [youtube_video, youtube_shorts]
      expect_seconds:
        description: "Fail the run unless the render lands on this duration (empty = no check)"
        required: false
        default: ""
      tolerance_seconds:
        description: "Allowed deviation from expect_seconds"
        required: false
        default: "0.5"
      min_live_visuals:
        description: "Fail unless this share of scenes got a real visual (0..1)"
        required: false
        default: "0.8"
      min_stock_footage:
        description: "Fail unless this share of scenes got moving stock footage (0..1)"
        required: false
        default: "0"

jobs:
  render:
    runs-on: ubuntu-latest
    # Выдача идёт на 60 кадрах: сцена снимается вдвое большим числом кадров,
    # чем при 30, и прежние 45 минут перестали быть запасом.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg + ensure media tools at /usr/bin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test -x /usr/bin/ffmpeg  || { echo "::error::/usr/bin/ffmpeg missing"; exit 1; }
          test -x /usr/bin/ffprobe || { echo "::error::/usr/bin/ffprobe missing"; exit 1; }
          if [ ! -e /usr/bin/google-chrome ]; then
            chrome="$(command -v google-chrome-stable || true)"
            [ -n "$chrome" ] && sudo ln -sf "$chrome" /usr/bin/google-chrome || true
          fi
          # Композер сцен обязателен: без Chrome пайплайн молча падает на
          # legacy-заливки, и ролик выходит не тем, что показывает продукт.
          /usr/bin/google-chrome --version || { echo "::error::google-chrome missing"; exit 1; }

      - name: Cache piper binary and voices
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/piper
            ~/.local/share/piper/voices
          key: piper-${{ runner.os }}-${{ hashFiles('scripts/install-piper-ci.sh') }}

      - name: Install piper (TTS) + voices
        run: bash scripts/install-piper-ci.sh

      - name: Install dependencies
        run: npm ci

      - name: Render project
        id: render
        env:
          HERMEST_CHROME_PATH: /usr/bin/google-chrome
          # Без этих ключей пайплайн тихо скатывается в статичный композер:
          # ни живого b-roll, ни нормального голоса. Раньше их тут не было —
          # отсюда и «слайд-шоу с механической озвучкой».
          HERMEST_PEXELS_API_KEY: ${{ secrets.HERMEST_PEXELS_API_KEY }}
          HERMEST_FAL_API_KEY: ${{ secrets.HERMEST_FAL_API_KEY }}
          HERMEST_ELEVENLABS_API_KEY: ${{ secrets.HERMEST_ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          output="$(mktemp -d /tmp/hermest-render-XXXXXX)"
          npm run --silent render:project -- \
            --input "${{ inputs.project }}" \
            --output "$output" \
            --platform "${{ inputs.platform }}" | tee /tmp/render-result.json
          video="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/render-result.json","utf8")).videoFile')"
          echo "video=$video" >> "$GITHUB_OUTPUT"
          echo "outputDir=$(dirname "$video")" >> "$GITHUB_OUTPUT"

      - name: Report duration and stream layout
        run: |
          set -euo pipefail
          video='${{ steps.render.outputs.video }}'
          duration="$(/usr/bin/ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")"
          streams="$(/usr/bin/ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -of csv=p=0 "$video" | tr '\n' ' ')"
          {
            echo "### Render complete"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| project | \`${{ inputs.project }}\` |"
            echo "| recipe | \`${{ inputs.platform }}\` |"
            echo "| duration | **${duration} s** |"
            echo "| streams | \`${streams}\` |"
            echo "| size | $(du -h "$video" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration: ${duration}s"

          # Длительность выводится из измеренной озвучки, а не задаётся числом,
          # поэтому «ровно минута» — проверяемое условие, а не обещание.
          expect='${{ inputs.expect_seconds }}'
          if [ -n "$expect" ]; then
            tol='${{ inputs.tolerance_seconds }}'
            node -e '
              const [actual, expect, tol] = process.argv.slice(1).map(Number);
              const drift = actual - expect;
              const ok = Math.abs(drift) <= tol;
              console.log(`${ok ? "on target" : "OFF TARGET"}: ${actual}s vs ${expect}s +/-${tol} (drift ${drift.toFixed(3)}s)`);
              if (!ok) {
                console.log(`::error::render is ${drift.toFixed(3)}s off the requested ${expect}s`);
                process.exit(1);
              }
            ' "$duration" "$expect" "$tol" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the visuals actually landed
        if: always() && steps.render.outputs.outputDir != ''
        run: |
          set -euo pipefail
          manifest="$(ls '${{ steps.render.outputs.outputDir }}'/*.manifest.json | head -1)"
          node scripts/check-visual-coverage.mjs "$manifest" \
            --min-live '${{ inputs.min_live_visuals }}' \
            --min-footage '${{ inputs.min_stock_footage }}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered video and sidecars
        # Ролик нужен и когда он не попал в целевую длительность: по нему
        # калибруется следующий прогон.
        if: always() && steps.render.outputs.video != ''
        uses: actions/upload-artifact@v4
        with:
          name: hermest-render-${{ inputs.platform }}-${{ github.run_id }}
          # Только результат и его доказательства: промежуточные PNG-кадры сцен
          # раздували артефакт до сотен мегабайт и никому не нужны после сборки.
          path: |
            ${{ steps.render.outputs.outputDir }}/*.mp4
            ${{ steps.render.outputs.outputDir }}/*.srt
            ${{ steps.render.outputs.outputDir }}/*.json
            ${{ steps.render.outputs.outputDir }}/*.sha256
          retention-days: 14
          if-no-files-found: error
